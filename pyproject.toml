[project]
name = "sp500-corr"
version = "0.1.0"
description = "Random matrix theory, PCA and minimum spanning trees on S&P 500 return correlations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "yfinance>=1.8.0",
]

[project.scripts]
sp500-corr = "sp500_corr.cli:main"
sp500-article = "sp500_corr.article:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
